<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="4;url=https://masecodes.dev" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #0f172a 0%, #020617 60%);
        color: #e2e8f0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .frame {
        width: min(100%, 40rem);
        padding: 2rem;
        border: 1px solid rgba(226, 232, 240, 0.12);
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.28);
      }
      .eyebrow {
        margin: 0 0 0.75rem;
        font-size: 0.85rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #7dd3fc;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 3.2rem);
        line-height: 1.05;
      }
      p {
        margin: 1.3rem 0 0;
        line-height: 1.8;
        color: #cbd5e1;
      }
      a {
        color: #7dd3fc;
        text-decoration: none;
        font-weight: 600;
      }
      .progress {
        position: relative;
        margin-top: 1.75rem;
        height: 0.55rem;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.16);
        overflow: hidden;
      }
      .bar {
        position: absolute;
        inset: 0;
        width: 0;
        background: linear-gradient(90deg, #38bdf8, #0ea5e9);
        animation: load 3.5s ease forwards;
      }
      @keyframes load {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }
    </style>
    <script>
      setTimeout(() => {
        window.location.href = "https://masecodes.dev";
      }, 3500);
    </script>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">Redirecting</p>
      <h1>Taking you to masecodes.dev</h1>
      <p>
        The page will automatically redirect in a few moments. If you are not redirected,
        <a href="https://masecodes.dev">click here</a>.
      </p>
      <div class="progress"><span class="bar"></span></div>
    </div>
  </body>
</html>
